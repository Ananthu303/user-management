<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | User System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .card {
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .btn-primary {
            background-color: #4e73df;
            border: none;
        }

        .btn-primary:hover {
            background-color: #375a7f;
        }

        .error-text {
            color: red;
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="card p-4" style="width: 400px;">
        <h3 class="text-center mb-3">Create Account</h3>

        <form id="registerForm">
            <div class="mb-3">
                <input type="text" id="username" class="form-control" placeholder="Username" required>
            </div>
            <div class="mb-3">
                <input type="email" id="email" class="form-control" placeholder="Email" required>
            </div>
            <div class="mb-3">
                <input type="password" id="password_1" class="form-control" placeholder="Password" required>
            </div>
            <div class="mb-3">
                <input type="password" id="password_2" class="form-control" placeholder="Confirm Password" required>
                <div id="passwordError" class="error-text mt-1"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>

        <p class="text-center mt-3 mb-0">
            Already have an account? <a href="{% url 'login_page' %}" class="text-decoration-none">Login here</a>
        </p>
    </div>

    <script>
        $(document).ready(function () {
            $("#registerForm").on("submit", function (e) {
                e.preventDefault();

                const username = $("#username").val().trim();
                const email = $("#email").val().trim();
                const password1 = $("#password_1").val();
                const password2 = $("#password_2").val();

                console.log(username, email, password1, password2)

                // Password match check
                if (password1 !== password2) {
                    $("#passwordError").text("Passwords do not match!");
                    return;
                } else {
                    $("#passwordError").text("");
                }

                $.ajax({
                    url: "{{ BASE_URL }}/api/accounts/users/register/",
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({
                        username: username,
                        email: email,
                        password_1: password1,
                        password_2: password2
                    }),
                    success: function (response) {
                        alert("Registration successful! You can now login.");
                        window.location.href = "/api/accounts/login/";
                    },
                    error: function (xhr) {
                        let msg = "Registration failed.";
                        if (xhr.responseJSON) {
                            msg = JSON.stringify(xhr.responseJSON);
                        }
                        alert(msg);
                    }
                });
            });
        });
    </script>

</body>

</html>
