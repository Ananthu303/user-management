<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | User System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #1cc88a, #4e73df);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
    }

    .card {
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .btn-success {
      background-color: #1cc88a;
      border: none;
    }

    .btn-success:hover {
      background-color: #17a673;
    }
  </style>
</head>

<body>
  <div class="card p-4" style="width: 400px;">
    <h3 class="text-center mb-3">Login</h3>
    <form id="loginForm">
      <div class="mb-3">
        <input type="email" id="loginEmail" class="form-control" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="password" id="loginPassword" class="form-control" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Login</button>
    </form>
    <p class="text-center mt-3 mb-0">
      Don’t have an account?
      <a href="{% url 'landing_page' %}" class="text-decoration-none">Register</a>
    </p>
  </div>

  <script>
    const BASE_URL = "{{ BASE_URL }}";

    $(document).ready(function () {
      $("#loginForm").on("submit", function (e) {
        e.preventDefault();

        const email = $("#loginEmail").val().trim();
        const password = $("#loginPassword").val().trim();

        if (!email || !password) {
          alert("Please fill in both fields.");
          return;
        }

        $.ajax({
          url: `${BASE_URL}/api/accounts/users/login/`,
          type: "POST",
          contentType: "application/json",
          data: JSON.stringify({ email: email, password: password }),
          success: function (response) {

            localStorage.setItem("access", response.access);
            localStorage.setItem("refresh", response.refresh);
            localStorage.setItem("user", JSON.stringify(response));



            alert("Login successful!");
            window.location.href = "/api/accounts/profile/";
          },
          error: function (xhr) {
            let msg = "Login failed. Please check your credentials.";
            if (xhr.responseJSON) {
              msg = JSON.stringify(xhr.responseJSON);
            }
            alert(msg);
          }
        });
      });
    });
  </script>
</body>

</html>
