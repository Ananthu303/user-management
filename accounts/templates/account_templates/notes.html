<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Notes</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background: linear-gradient(135deg, #e3f2fd, #f9f9ff);
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
    }

    .navbar {
      background-color: #4e73df;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
    }

    .navbar-brand {
      color: #fff !important;
      font-weight: 600;
    }

    .container {
      margin-top: 60px;
      max-width: 1100px;
    }

    .card {
      border: none;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    }

    .card h5 {
      color: #4e73df;
      font-weight: 600;
    }

    .btn-primary,
    .btn-success,
    .btn-danger {
      border-radius: 10px;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #375a7f;
    }

    .btn-success {
      background-color: #1cc88a;
      border: none;
    }

    .btn-success:hover {
      background-color: #17a673;
    }

    .modal-content {
      border-radius: 20px;
      border: none;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      border-bottom: none;
      background-color: #4e73df;
      color: white;
      border-radius: 20px 20px 0 0;
    }

    .form-control {
      border-radius: 10px;
    }

    #notesList {
      margin-top: 30px;
    }

    .note-meta {
      font-size: 0.85rem;
      color: #6c757d;
    }

    .attachment-link {
      display: inline-block;
      margin-top: 5px;
      font-size: 0.9rem;
      color: #4e73df;
      text-decoration: none;
    }

    .attachment-link:hover {
      text-decoration: underline;
    }

    .empty-msg {
      text-align: center;
      color: #6c757d;
      font-size: 1.1rem;
      margin-top: 50px;
    }
  </style>
</head>

<body>

  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container-fluid px-4">
      <a class="navbar-brand" href="#">📝 My Notes</a>
      <div>
        <button id="addNoteBtn" class="btn btn-light me-2" data-bs-toggle="modal" data-bs-target="#noteModal">
          + Add Note
        </button>
        <button id="logoutBtn" class="btn btn-danger">Logout</button>
      </div>
    </div>
  </nav>


  <div class="container">
    <div id="notesList" class="row g-4"></div>
  </div>


  <div class="modal fade" id="noteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="noteForm" enctype="multipart/form-data">
          <div class="modal-header">
            <h5 class="modal-title" id="noteModalTitle">Add Note</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="noteId">
            <div class="mb-3">
              <label class="form-label">Title</label>
              <input type="text" id="noteTitle" class="form-control" placeholder="Enter note title" required />
            </div>
            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea id="noteDescription" class="form-control" rows="4" placeholder="Write something..."
                required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Attachment (optional)</label>
              <input type="file" id="noteAttachment" class="form-control" />
            </div>
          </div>

          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="saveNoteBtn">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>


  <script>
    const BASE_URL = "{{ BASE_URL }}";
    let isEditMode = false;

    $(document).ready(function () {
      const accessToken = localStorage.getItem("access");
      if (!accessToken) {
        alert("Please login first.");
        window.location.href = "/api/accounts/login/";
        return;
      }

      const headers = { Authorization: `Bearer ${accessToken}` };

      function loadNotes() {
        $.ajax({
          url: `${BASE_URL}/api/notes/`,
          type: "GET",
          headers,
          success: function (data) {
            $("#notesList").empty();
            if (data.length === 0) {
              $("#notesList").html("<p class='empty-msg'>No notes found. Click <strong>+ Add Note</strong> to create one.</p>");
              return;
            }

            data.forEach(note => {
              const createdDate = new Date(note.created_at);
              const modDate = new Date(note.modified_at);

              const createdText = createdDate.toLocaleString();
              const modifiedText = modDate.toLocaleString();

              // show "Updated at" only if different from created_at
              const updatedInfo =
                createdDate.getTime() !== modDate.getTime()
                  ? `<p class="note-meta mt-2">Updated: ${modifiedText}</p>`
                  : "";

              $("#notesList").append(`
          <div class="col-md-4">
            <div class="card p-4 h-100">
              <h5>${note.title}</h5>
              <p>${note.description}</p>
              ${note.attachment ? `<a href="${note.attachment}" target="_blank" class="attachment-link">📎 View Attachment</a>` : ""}
              <p class="note-meta mt-2">Created: ${createdText}</p>
              ${updatedInfo}
              <div class="mt-3 d-flex justify-content-between">
                <button class="btn btn-sm btn-outline-primary editBtn" data-id="${note.id}">Edit</button>
                <button class="btn btn-sm btn-outline-danger deleteBtn" data-id="${note.id}">Delete</button>
              </div>
            </div>
          </div>
        `);
            });
          },
          error: function () {
            alert("Failed to fetch notes. Please login again.");
            localStorage.clear();
            window.location.href = "/api/accounts/login/";
          }
        });
      }

      loadNotes();

      // Add Note
      $("#addNoteBtn").click(function () {
        isEditMode = false;
        $("#noteModalTitle").text("Add Note");
        $("#noteForm")[0].reset();
        $("#noteId").val("");
      });

      // Save Note
      $("#noteForm").submit(function (e) {
        e.preventDefault();

        const formData = new FormData();
        formData.append("title", $("#noteTitle").val());
        formData.append("description", $("#noteDescription").val());

        const fileInput = $("#noteAttachment")[0];
        if (fileInput.files.length > 0) {
          formData.append("attachment", fileInput.files[0]);
        }

        const noteId = $("#noteId").val();
        const url = noteId ? `${BASE_URL}/api/notes/${noteId}/` : `${BASE_URL}/api/notes/`;
        const method = noteId ? "PATCH" : "POST";

        $.ajax({
          url,
          type: method,
          headers,
          processData: false,
          contentType: false,
          data: formData,
          success: function () {
            $("#noteModal").modal("hide");
            loadNotes();
          },
          error: function (xhr) {
            alert("Error: " + JSON.stringify(xhr.responseJSON));
          }
        });
      });

      // Edit Note
      $(document).on("click", ".editBtn", function () {
        const noteId = $(this).data("id");
        $.ajax({
          url: `${BASE_URL}/api/notes/${noteId}/`,
          type: "GET",
          headers,
          success: function (note) {
            isEditMode = true;
            $("#noteModalTitle").text("Edit Note");
            $("#noteId").val(note.id);
            $("#noteTitle").val(note.title);
            $("#noteDescription").val(note.description);
            $("#noteModal").modal("show");
          },
          error: function () {
            alert("Failed to load note details.");
          }
        });
      });

      // Delete Note
      $(document).on("click", ".deleteBtn", function () {
        const noteId = $(this).data("id");
        if (!confirm("Are you sure you want to delete this note?")) return;

        $.ajax({
          url: `${BASE_URL}/api/notes/${noteId}/`,
          type: "DELETE",
          headers,
          success: function () {
            loadNotes();
          },
          error: function () {
            alert("Error deleting note.");
          }
        });
      });

      // Logout
      $("#logoutBtn").click(function () {
        localStorage.clear();
        alert("Logged out successfully!");
        window.location.href = "/api/accounts/login/";
      });
    });
  </script>
</body>

</html>
